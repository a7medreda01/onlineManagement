<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Besnesy — منصة إدارة مشروعك الأونلاين</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Google Fonts: Cairo & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Pre-paint theme initializer to avoid layout flash -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.add('light-mode');
          document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('light-mode');
          });
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-cairo antialiased selection:bg-sky-500 selection:text-white">
  <app-root></app-root>
</body>
</html>
