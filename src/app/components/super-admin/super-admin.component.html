<div class="min-h-screen bg-slate-950 text-slate-100 p-4 sm:p-6 lg:p-8 font-cairo" dir="rtl">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Top SuperAdmin Header -->
    <div class="glass-card p-6 border-indigo-500/30 bg-slate-900/90 shadow-2xl rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-sky-600 to-emerald-500 flex items-center justify-center text-white text-2xl shadow-lg shadow-indigo-950/50">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-2xl font-black tracking-tight text-slate-100">لوحة تحكم السوبر أدمن — Besnesy</h1>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">SuperAdmin</span>
          </div>
          <p class="text-xs text-slate-400 mt-1">الإشراف الشامل على جميع متاجر المنصة، الاشتراكات، الأرباح، والطلبات</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button (click)="logout()" class="btn bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 text-xs py-2 px-4 flex items-center gap-2">
          <i class="bi bi-box-arrow-right"></i>
          <span>تسجيل الخروج</span>
        </button>
      </div>
    </div>

    <!-- Modular Overview & Revenue Cards Component -->
    <app-super-admin-overview-cards [overview]="overview()"></app-super-admin-overview-cards>

    <!-- Navigation Tabs -->
    <div class="flex flex-wrap items-center gap-2 border-b border-slate-800 pb-2">
      <button (click)="activeTab = 'stores'" [ngClass]="activeTab === 'stores' ? 'bg-sky-500/20 text-sky-400 border-sky-500/50' : 'text-slate-400 hover:text-slate-200 border-transparent'"
              class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center gap-2">
        <i class="bi bi-shop"></i>
        <span>المتاجر والاشتراكات ({{ tenants().length }})</span>
      </button>

      <button (click)="activeTab = 'requests'" [ngClass]="activeTab === 'requests' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'text-slate-400 hover:text-slate-200 border-transparent'"
              class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center gap-2 relative">
        <i class="bi bi-credit-card-2-front-fill"></i>
        <span>طلبات التحويل وتفعيل الاشتراكات</span>
        <span *ngIf="(overview()?.pendingPaymentRequestsCount || 0) > 0" class="w-5 h-5 rounded-full bg-rose-500 text-white text-[10px] flex items-center justify-center font-bold">
          {{ overview()?.pendingPaymentRequestsCount }}
        </span>
      </button>

      <button (click)="activeTab = 'plans'" [ngClass]="activeTab === 'plans' ? 'bg-indigo-500/20 text-indigo-400 border-indigo-500/50' : 'text-slate-400 hover:text-slate-200 border-transparent'"
              class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center gap-2">
        <i class="bi bi-sliders"></i>
        <span>إدارة باقات المنصة والصلاحيات</span>
      </button>

      <button (click)="activeTab = 'email'" [ngClass]="activeTab === 'email' ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'text-slate-400 hover:text-slate-200 border-transparent'"
              class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all flex items-center gap-2">
        <i class="bi bi-envelope-paper-heart-fill"></i>
        <span>إرسال العروض والحملات البريدية</span>
      </button>
    </div>

    <!-- TAB 1: Modular Stores & Subscriptions List Component -->
    <div *ngIf="activeTab === 'stores'">
      <app-super-admin-tenants-list
        [tenants]="tenants()"
        [filteredTenants]="filteredTenants()"
        (search)="onSearch($event)"
        (exportCustomers)="exportCustomers($event)"
        (extendTenant)="openExtendModal($event)"
        (suspendTenant)="openSuspendModal($event)"
        (reactivateTenant)="reactivateTenant($event)">
      </app-super-admin-tenants-list>
    </div>

    <!-- TAB 2: Modular InstaPay Requests List Component -->
    <div *ngIf="activeTab === 'requests'">
      <app-super-admin-requests-list
        [requests]="subscriptionRequests()"
        (approve)="approveRequest($event)"
        (reject)="openRejectModal($event)">
      </app-super-admin-requests-list>
    </div>

    <!-- TAB 3: Modular Plans Manager Component -->
    <div *ngIf="activeTab === 'plans'">
      <app-super-admin-plans-manager
        [plans]="plans()"
        [planForm]="planForm"
        [editingPlanId]="editingPlanId"
        (submitPlan)="savePlan()"
        (editPlan)="editPlan($event)"
        (cancelEdit)="resetPlanForm()">
      </app-super-admin-plans-manager>
    </div>

    <!-- TAB 4: Modular Broadcast Email Component -->
    <div *ngIf="activeTab === 'email'">
      <app-super-admin-broadcast-email
        [emailForm]="emailForm"
        [sending]="sendingEmail()"
        (send)="sendBroadcastEmail()">
      </app-super-admin-broadcast-email>
    </div>

  </div>

  <!-- Suspend Modal -->
  <div *ngIf="showSuspendModal" class="app-modal-overlay">
    <div class="glass-card w-full max-w-md p-6 fade-in my-auto max-h-[90vh] overflow-y-auto shadow-2xl border-slate-700">
      <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
        <h3 class="font-bold text-lg text-slate-100 flex items-center gap-2">
          <i class="bi bi-pause-circle text-rose-400"></i>
          <span>إيقاف اشتراك متجر: {{ selectedTenant?.storeName }}</span>
        </h3>
        <button (click)="showSuspendModal = false" class="text-slate-400 hover:text-white"><i class="bi bi-x-lg text-lg"></i></button>
      </div>

      <div class="space-y-4">
        <div class="form-group">
          <label class="form-label">سبب الإيقاف (سيظهر لصاحب المتجر)</label>
          <textarea [(ngModel)]="suspendReason" rows="3" class="form-textarea" placeholder="مثال: انتهاء صلاحية الاشتراك أو مخالفة الشروط..." required></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" (click)="showSuspendModal = false" class="btn btn-secondary">إلغاء</button>
          <button type="button" (click)="confirmSuspend()" class="btn bg-rose-600 hover:bg-rose-500 text-white">تأكيد الإيقاف</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Extend Modal -->
  <div *ngIf="showExtendModal" class="app-modal-overlay">
    <div class="glass-card w-full max-w-md p-6 fade-in my-auto max-h-[90vh] overflow-y-auto shadow-2xl border-slate-700">
      <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
        <h3 class="font-bold text-lg text-slate-100 flex items-center gap-2">
          <i class="bi bi-calendar-plus text-emerald-400"></i>
          <span>تمديد اشتراك متجر: {{ selectedTenant?.storeName }}</span>
        </h3>
        <button (click)="showExtendModal = false" class="text-slate-400 hover:text-white"><i class="bi bi-x-lg text-lg"></i></button>
      </div>

      <div class="space-y-4">
        <div class="form-group">
          <label class="form-label">عدد الأيام الإضافية</label>
          <input type="number" [(ngModel)]="additionalDays" min="1" max="3650" class="form-control" required />
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" (click)="showExtendModal = false" class="btn btn-secondary">إلغاء</button>
          <button type="button" (click)="confirmExtend()" class="btn bg-emerald-600 hover:bg-emerald-500 text-white">تأكيد التمديد</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reject Payment Modal -->
  <div *ngIf="showRejectModal" class="app-modal-overlay">
    <div class="glass-card w-full max-w-md p-6 fade-in my-auto max-h-[90vh] overflow-y-auto shadow-2xl border-slate-700">
      <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
        <h3 class="font-bold text-lg text-slate-100 flex items-center gap-2">
          <i class="bi bi-x-circle text-rose-400"></i>
          <span>رفض طلب التحويل لمتجر: {{ selectedRequest?.storeName }}</span>
        </h3>
        <button (click)="showRejectModal = false" class="text-slate-400 hover:text-white"><i class="bi bi-x-lg text-lg"></i></button>
      </div>

      <div class="space-y-4">
        <div class="form-group">
          <label class="form-label">سبب الرفض</label>
          <textarea [(ngModel)]="rejectReason" rows="3" class="form-textarea" placeholder="مثال: لم يتم استلام التحويل على إنستاباي، رقم غير مطابق..." required></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" (click)="showRejectModal = false" class="btn btn-secondary">إلغاء</button>
          <button type="button" (click)="confirmRejectRequest()" class="btn bg-rose-600 hover:bg-rose-500 text-white">تأكيد الرفض</button>
        </div>
      </div>
    </div>
  </div>

</div>
