<div class="min-h-screen bg-slate-950 text-slate-100 p-4 sm:p-6 lg:p-8 font-cairo" dir="rtl">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- SuperAdmin Sticky Responsive Toolbar Component -->
    <app-super-admin-toolbar
      [activeTab]="activeTab"
      [totalStores]="tenants().length"
      [pendingRequests]="overview()?.pendingPaymentRequestsCount || 0"
      [totalRevenue]="overview()?.totalPlatformRevenue || 0"
      (tabChange)="activeTab = $event"
      (refresh)="refreshAll()"
      (logout)="logout()">
    </app-super-admin-toolbar>

    <!-- Modular Overview & Revenue Cards Component -->
    <app-super-admin-overview-cards [overview]="overview()"></app-super-admin-overview-cards>

    <!-- TAB 1: Modular Stores & Subscriptions List Component -->
    <div *ngIf="activeTab === 'stores'">
      <app-super-admin-tenants-list
        [tenants]="tenants()"
        [filteredTenants]="filteredTenants()"
        (search)="onSearch($event)"
        (exportCustomers)="exportCustomers($event)"
        (extendTenant)="openExtendModal($event)"
        (suspendTenant)="openSuspendModal($event)"
        (reactivateTenant)="reactivateTenant($event)">
      </app-super-admin-tenants-list>
    </div>

    <!-- TAB 2: Modular InstaPay Requests List Component -->
    <div *ngIf="activeTab === 'requests'">
      <app-super-admin-requests-list
        [requests]="subscriptionRequests()"
        (approve)="approveRequest($event)"
        (reject)="openRejectModal($event)">
      </app-super-admin-requests-list>
    </div>

    <!-- TAB 3: Modular Plans Manager Component -->
    <div *ngIf="activeTab === 'plans'">
      <app-super-admin-plans-manager
        [plans]="plans()"
        [planForm]="planForm"
        [editingPlanId]="editingPlanId"
        (submitPlan)="savePlan()"
        (editPlan)="editPlan($event)"
        (cancelEdit)="resetPlanForm()">
      </app-super-admin-plans-manager>
    </div>

    <!-- TAB 4: Modular Broadcast Email Component -->
    <div *ngIf="activeTab === 'email'">
      <app-super-admin-broadcast-email
        [emailForm]="emailForm"
        [sending]="sendingEmail()"
        (send)="sendBroadcastEmail()">
      </app-super-admin-broadcast-email>
    </div>

  </div>

  <!-- Modular Modals Component (Suspend, Extend, Reject) -->
  <app-super-admin-modals
    [showSuspendModal]="showSuspendModal"
    [selectedTenant]="selectedTenant"
    [suspendReason]="suspendReason"
    (closeSuspend)="showSuspendModal = false"
    (confirmSuspend)="confirmSuspend($event)"

    [showExtendModal]="showExtendModal"
    [additionalDays]="additionalDays"
    (closeExtend)="showExtendModal = false"
    (confirmExtend)="confirmExtend($event)"

    [showRejectModal]="showRejectModal"
    [selectedRequest]="selectedRequest"
    [rejectReason]="rejectReason"
    (closeReject)="showRejectModal = false"
    (confirmReject)="confirmRejectRequest($event)">
  </app-super-admin-modals>

</div>
