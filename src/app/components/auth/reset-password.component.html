<div class="auth-page-bg font-cairo min-h-screen relative overflow-hidden flex items-center justify-center p-4">
  <!-- Ambient Glow Orbs -->
  <div class="absolute top-1/4 -right-32 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 -left-32 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top Back Link & Theme Toggle -->
  <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-20">
    <a routerLink="/login" class="text-xs font-bold text-slate-400 hover:text-indigo-400 flex items-center gap-1.5 transition">
      <i class="fa-solid fa-arrow-right"></i>
      <span>العودة لتسجيل الدخول</span>
    </a>

    <button (click)="toggleTheme()" class="btn btn-secondary btn-sm rounded-xl py-1.5 px-3 text-xs shadow-sm">
      <i class="fa-solid text-amber-400" [class.fa-sun]="isDarkMode" [class.fa-moon]="!isDarkMode"></i>
      <span>{{ isDarkMode ? 'مظهر فاتح' : 'مظهر داكن' }}</span>
    </button>
  </div>

  <!-- Reset Password Card -->
  <div class="auth-card w-full max-w-md p-8 fade-in relative z-10">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-emerald-500 to-sky-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 border border-emerald-400/30 shadow-lg shadow-emerald-500/20 text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-100 mb-1">تعيين كلمة مرور جديدة</h2>
      <p class="text-slate-400 text-xs sm:text-sm">أدخل الرمز وكلمة المرور الجديدة لحسابك</p>
    </div>

    <!-- Success Result Box -->
    <div *ngIf="successMessage" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 p-4 rounded-2xl text-xs mb-6 space-y-3 text-center">
      <div class="flex items-center justify-center gap-2 font-bold text-sm">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span>{{ successMessage }}</span>
      </div>
      <p class="text-slate-400 text-xs">يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.</p>
      <div class="pt-2">
        <a routerLink="/login" class="btn btn-primary w-full py-2.5 text-xs font-bold shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>تسجيل الدخول الآن</span>
        </a>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs mb-6 flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation text-sm"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage" class="space-y-4">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="name@store.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">رمز التعيين (Reset Token)</label>
        <input type="text" [(ngModel)]="token" name="token" class="form-control font-mono text-xs" placeholder="أدخل رمز التعيين" required />
      </div>

      <div class="form-group">
        <label class="form-label">كلمة المرور الجديدة</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" class="form-control" placeholder="8 أحرف على الأقل" required />
      </div>

      <div class="form-group">
        <label class="form-label">تأكيد كلمة المرور الجديدة</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" placeholder="أعد إدخال كلمة المرور" required />
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-primary w-full py-3 text-base shadow-lg shadow-emerald-600/30 font-bold mt-2">
        <i *ngIf="loading" class="fa-solid fa-circle-notch fa-spin"></i>
        <span *ngIf="!loading">تغيير كلمة المرور</span>
      </button>
    </form>
  </div>
</div>
