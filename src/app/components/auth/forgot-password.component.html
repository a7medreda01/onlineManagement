<div class="auth-page-bg font-cairo min-h-screen relative overflow-hidden flex items-center justify-center p-4">
  <!-- Ambient Glow Orbs -->
  <div class="absolute top-1/4 -right-32 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 -left-32 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top Back Link & Theme Toggle -->
  <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-20">
    <a routerLink="/login" class="text-xs font-bold text-slate-400 hover:text-indigo-400 flex items-center gap-1.5 transition">
      <i class="fa-solid fa-arrow-right"></i>
      <span>العودة لتسجيل الدخول</span>
    </a>

    <button (click)="toggleTheme()" class="btn btn-secondary btn-sm rounded-xl py-1.5 px-3 text-xs shadow-sm">
      <i class="fa-solid text-amber-400" [class.fa-sun]="isDarkMode" [class.fa-moon]="!isDarkMode"></i>
      <span>{{ isDarkMode ? 'مظهر فاتح' : 'مظهر داكن' }}</span>
    </button>
  </div>

  <!-- Forgot Password Card -->
  <div class="auth-card w-full max-w-md p-8 fade-in relative z-10">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 border border-amber-400/30 shadow-lg shadow-amber-500/20 text-2xl">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-100 mb-1">نسيت كلمة المرور؟</h2>
      <p class="text-slate-400 text-xs sm:text-sm">أدخل بريدك الإلكتروني لاستلام رمز إعادة التعيين</p>
    </div>

    <!-- Success Result Box -->
    <div *ngIf="successMessage" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 p-4 rounded-2xl text-xs mb-6 space-y-3">
      <div class="flex items-center gap-2 font-bold text-sm">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span>{{ successMessage }}</span>
      </div>
      <div *ngIf="generatedToken" class="p-3 bg-slate-950/60 rounded-xl border border-slate-700/80 space-y-1">
        <span class="text-[11px] text-slate-400 block font-semibold">رمز إعادة التعيين التجريبي (Dev Token):</span>
        <code class="text-amber-300 text-xs font-mono select-all block break-all font-bold">{{ generatedToken }}</code>
      </div>
      <div class="pt-1">
        <a [routerLink]="['/reset-password']" [queryParams]="{ email: email, token: generatedToken }" class="btn btn-primary w-full py-2.5 text-xs font-bold shadow-md flex items-center justify-center gap-2">
          <span>الانتقال لصفحة تعيين كلمة المرور الجديدة</span>
          <i class="fa-solid fa-arrow-left"></i>
        </a>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs mb-6 flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation text-sm"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage" class="space-y-4">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني المسجل بالمتجر</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="name@store.com" required />
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-primary w-full py-3 text-base shadow-lg shadow-indigo-600/30 font-bold mt-2">
        <i *ngIf="loading" class="fa-solid fa-circle-notch fa-spin"></i>
        <span *ngIf="!loading">إرسال رمز التعيين</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
      <a routerLink="/login" class="text-xs text-slate-400 hover:text-sky-400 font-semibold transition">
        تذكرت كلمة المرور؟ تسجيل الدخول
      </a>
    </div>
  </div>
</div>
