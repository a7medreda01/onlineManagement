<div class="relative w-full font-cairo" [style.z-index]="isOpen() ? 99999 : 'auto'">
  <label *ngIf="label" class="form-label text-xs font-bold text-slate-300 mb-1 flex items-center gap-1.5">
    <i *ngIf="icon" [class]="icon + ' text-amber-400'"></i>
    <span>{{ label }}</span>
  </label>

  <!-- Dropdown Trigger Box -->
  <div 
    (click)="toggleOpen()" 
    class="dropdown-trigger flex items-center justify-between px-3 py-2 bg-slate-800/90 border border-slate-700/80 rounded-xl cursor-pointer hover:border-amber-500/50 hover:bg-slate-800 transition shadow-sm group min-h-[40px]"
    [class.border-amber-500]="isOpen()"
    [class.ring-2]="isOpen()"
    [class.ring-amber-500\/25]="isOpen()"
  >
    <div class="flex items-center gap-2 overflow-hidden min-w-0">
      <!-- Product Image or Icon -->
      <img *ngIf="selectedOption?.imageUrl" [src]="selectedOption?.imageUrl" class="w-7 h-7 rounded-lg object-cover border border-slate-700 shrink-0" alt="" (error)="$event.target.style.display='none'" />
      <div *ngIf="!selectedOption?.imageUrl && selectedOption?.icon" class="w-7 h-7 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center text-xs shrink-0">
        <i [class]="selectedOption?.icon"></i>
      </div>

      <div class="overflow-hidden min-w-0">
        <div *ngIf="selectedOption" class="text-xs font-bold text-slate-100 truncate flex items-center gap-2">
          <span class="truncate">{{ selectedOption.label }}</span>
          <span *ngIf="selectedOption.badge" class="text-[9px] px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 shrink-0">
            {{ selectedOption.badge }}
          </span>
        </div>
        <div *ngIf="selectedOption?.sublabel" class="text-[10px] text-slate-400 truncate">
          {{ selectedOption?.sublabel }}
        </div>
        <span *ngIf="!selectedOption" class="text-xs text-slate-400 truncate">{{ placeholder }}</span>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0 mr-1">
      <button 
        *ngIf="value !== null && value !== undefined" 
        type="button"
        (click)="clearSelection($event)" 
        class="text-slate-400 hover:text-rose-400 text-xs p-1"
        title="إعادة التعيين"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
      <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-amber-400 transition-transform" [class.rotate-180]="isOpen()"></i>
    </div>
  </div>

  <!-- Dropdown Options Menu Panel -->
  <div 
    *ngIf="isOpen()" 
    class="custom-dropdown-popover absolute right-0 top-full mt-2 w-full min-w-[220px] max-h-64 p-2 glass-card shadow-2xl border border-amber-500/40 fade-in rounded-2xl bg-slate-900/98 backdrop-blur-xl flex flex-col z-50"
  >
    <!-- Search Bar -->
    <div *ngIf="searchable" class="p-1 mb-1 border-b border-slate-700/80 relative">
      <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input 
        type="text" 
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        placeholder="بحث باسم المنتج..." 
        class="w-full pr-8 pl-3 py-1.5 bg-slate-800/80 border border-slate-700 rounded-lg text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500"
      />
    </div>

    <!-- Options List -->
    <div class="overflow-y-auto space-y-1 max-h-48 p-0.5 custom-scrollbar">
      <div 
        *ngFor="let opt of filteredOptions"
        (click)="selectOption(opt)"
        class="flex items-center justify-between p-2 rounded-xl cursor-pointer text-xs font-semibold transition hover:bg-amber-500/15 hover:text-amber-300"
        [class.bg-amber-500\/20]="opt.value === value"
        [class.text-amber-300]="opt.value === value"
        [class.font-bold]="opt.value === value"
        [class.text-slate-200]="opt.value !== value"
      >
        <div class="flex items-center gap-2.5 overflow-hidden min-w-0">
          <img *ngIf="opt.imageUrl" [src]="opt.imageUrl" class="w-8 h-8 rounded-lg object-cover border border-slate-700 shrink-0" alt="" (error)="$event.target.style.display='none'" />
          <i *ngIf="!opt.imageUrl && opt.icon" [class]="opt.icon + ' text-amber-400 text-xs shrink-0'"></i>
          <div class="overflow-hidden min-w-0">
            <div class="truncate font-bold text-xs">{{ opt.label }}</div>
            <div *ngIf="opt.sublabel" class="text-[10px] text-slate-400 truncate">{{ opt.sublabel }}</div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <span *ngIf="opt.badge" class="text-[9px] px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
            {{ opt.badge }}
          </span>
          <i *ngIf="opt.value === value" class="fa-solid fa-check text-amber-400 text-xs"></i>
        </div>
      </div>

      <div *ngIf="filteredOptions.length === 0" class="p-4 text-center text-xs text-slate-400">
        لا توجد نتائج مطابقة
      </div>
    </div>
  </div>
</div>
