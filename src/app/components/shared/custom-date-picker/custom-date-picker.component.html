<div class="relative w-full font-cairo" [style.z-index]="isOpen() ? 99999 : 'auto'">
  <label *ngIf="label" class="form-label text-xs font-bold text-slate-300 mb-1 flex items-center gap-1.5">
    <i class="fa-solid fa-calendar-days text-amber-400"></i>
    <span>{{ label }}</span>
  </label>

  <!-- Input Trigger Box -->
  <div 
    (click)="toggleOpen()" 
    class="datepicker-trigger flex items-center justify-between px-3.5 py-2.5 bg-slate-800/90 border border-slate-700/80 rounded-xl cursor-pointer hover:border-amber-500/50 hover:bg-slate-800 transition shadow-sm group"
    [class.border-amber-500]="isOpen()"
    [class.ring-2]="isOpen()"
    [class.ring-amber-500\/25]="isOpen()"
  >
    <div class="flex items-center gap-2.5 overflow-hidden">
      <div class="w-7 h-7 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center text-xs shrink-0 group-hover:scale-105 transition-transform">
        <i class="fa-solid fa-calendar-day"></i>
      </div>
      <span *ngIf="value" class="text-xs font-mono font-bold text-slate-100 dir-ltr">{{ formattedDisplayValue }}</span>
      <span *ngIf="!value" class="text-xs text-slate-400">{{ placeholder }}</span>
    </div>

    <div class="flex items-center gap-2">
      <button 
        *ngIf="value" 
        type="button"
        (click)="$event.stopPropagation(); clearDate()" 
        class="text-slate-400 hover:text-rose-400 text-xs p-1"
        title="مسح التاريخ"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
      <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-amber-400 transition-transform" [class.rotate-180]="isOpen()"></i>
    </div>
  </div>

  <!-- Popover Calendar Modal Panel -->
  <div 
    *ngIf="isOpen()" 
    class="custom-date-picker-popover absolute right-0 w-72 sm:w-80 p-4 glass-card shadow-2xl border border-amber-500/40 fade-in rounded-2xl bg-slate-900/98 backdrop-blur-xl z-50"
    [class.top-full]="!isUpward()"
    [class.mt-2]="!isUpward()"
    [class.bottom-full]="isUpward()"
    [class.mb-2]="isUpward()"
  >
    <!-- Quick Presets Toolbar -->
    <div class="grid grid-cols-3 gap-1.5 mb-3 pb-3 border-b border-slate-700/80">
      <button type="button" (click)="setToday()" class="px-2 py-1 text-[11px] font-bold rounded-lg bg-slate-800 hover:bg-amber-500/20 text-amber-300 border border-slate-700 hover:border-amber-500/40 transition">
        اليوم
      </button>
      <button type="button" (click)="setYesterday()" class="px-2 py-1 text-[11px] font-bold rounded-lg bg-slate-800 hover:bg-amber-500/20 text-slate-300 border border-slate-700 hover:border-amber-500/40 transition">
        أمس
      </button>
      <button type="button" (click)="setFirstOfCurrentMonth()" class="px-2 py-1 text-[11px] font-bold rounded-lg bg-slate-800 hover:bg-amber-500/20 text-slate-300 border border-slate-700 hover:border-amber-500/40 transition">
        أول الشهر
      </button>
    </div>

    <!-- Calendar Month/Year Controls Header -->
    <div class="flex items-center justify-between mb-3 px-1">
      <button type="button" (click)="prevMonth()" class="w-8 h-8 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs border border-slate-700/60">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <div class="text-xs font-extrabold text-amber-300 tracking-wide">
        {{ monthNames[currentMonth()] }} {{ currentYear() }}
      </div>

      <button type="button" (click)="nextMonth()" class="w-8 h-8 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs border border-slate-700/60">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
    </div>

    <!-- Days of Week Header -->
    <div class="grid grid-cols-7 gap-1 text-center mb-2">
      <span *ngFor="let dayName of weekDays" class="text-[10px] font-bold text-slate-400 py-1">
        {{ dayName }}
      </span>
    </div>

    <!-- Calendar Days Grid -->
    <div class="grid grid-cols-7 gap-1 text-center">
      <button
        *ngFor="let d of calendarDays"
        type="button"
        (click)="selectDate(d.dateStr)"
        class="h-8 w-full rounded-lg text-xs font-bold transition flex items-center justify-center relative"
        [class.text-slate-500]="!d.isCurrentMonth"
        [class.text-slate-200]="d.isCurrentMonth && !d.isSelected && !d.isToday"
        [class.hover:bg-slate-800]="!d.isSelected"
        [class.bg-gradient-to-r]="d.isSelected"
        [class.from-amber-500]="d.isSelected"
        [class.to-amber-600]="d.isSelected"
        [class.text-slate-950]="d.isSelected"
        [class.shadow-md]="d.isSelected"
        [class.border]="d.isToday && !d.isSelected"
        [class.border-amber-400\/60]="d.isToday && !d.isSelected"
        [class.text-amber-300]="d.isToday && !d.isSelected"
      >
        <span>{{ d.dayNum }}</span>
        <span *ngIf="d.isToday && !d.isSelected" class="absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-amber-400"></span>
      </button>
    </div>
  </div>
</div>
