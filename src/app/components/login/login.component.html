<div class="auth-page-bg font-cairo min-h-screen relative overflow-hidden">
  <!-- Ambient Glow Orbs -->
  <div class="absolute top-1/4 -right-32 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 -left-32 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top Theme Switcher & Back Home -->
  <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-20">
    <a routerLink="/" class="text-xs font-bold text-slate-400 hover:text-indigo-400 flex items-center gap-1.5 transition">
      <i class="fa-solid fa-arrow-right"></i>
      <span>الرئيسية</span>
    </a>

    <button (click)="toggleTheme()" class="btn btn-secondary btn-sm rounded-xl py-1.5 px-3 text-xs shadow-sm">
      <i class="fa-solid text-amber-400" [class.fa-sun]="isDarkMode" [class.fa-moon]="!isDarkMode"></i>
      <span>{{ isDarkMode ? 'مظهر فاتح' : 'مظهر داكن' }}</span>
    </button>
  </div>

  <!-- Main Login Card -->
  <div class="auth-card w-full max-w-md p-8 fade-in relative z-10">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-sky-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-400/30 shadow-lg shadow-indigo-500/20">
        <i class="fa-solid fa-store text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-100 mb-1">نظام إدارة المبيعات أونلاين</h2>
      <p class="text-slate-400 text-xs sm:text-sm">تسجيل الدخول للوحة تحكم المتجر</p>
    </div>

    <div *ngIf="errorMessage" class="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-4 rounded-xl text-xs mb-6 flex flex-col gap-2">
      <div class="flex items-center gap-2 font-bold">
        <i class="fa-solid fa-circle-exclamation text-sm"></i>
        <span>{{ errorMessage }}</span>
      </div>
      <div *ngIf="requiresActivation" class="pt-2 border-t border-rose-500/20 text-center">
        <a [routerLink]="['/activate-account']" [queryParams]="{ email: username }" class="text-sky-400 hover:underline font-bold text-xs">
          اضغط هنا لتأكيد تفعيل الإيميل الآن ←
        </a>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="form-group">
        <label class="form-label">اسم المستخدم أو البريد الإلكتروني</label>
        <input type="text" [(ngModel)]="username" name="username" class="form-control" placeholder="أدخل اسم المستخدم أو الإيميل" required />
      </div>

      <div class="form-group">
        <div class="flex items-center justify-between mb-1">
          <label class="form-label mb-0">كلمة المرور</label>
          <a routerLink="/forgot-password" class="text-xs text-sky-400 hover:underline font-semibold">نسيت كلمة المرور؟</a>
        </div>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required />
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-primary w-full py-3 text-base shadow-lg shadow-indigo-600/30 font-bold mt-2">
        <i *ngIf="loading" class="fa-solid fa-circle-notch fa-spin"></i>
        <span *ngIf="!loading">تسجيل الدخول</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
      <p class="text-xs text-slate-400 mb-2">ليس لديك متجر بعد؟</p>
      <a routerLink="/signup" class="text-xs text-sky-400 font-bold hover:underline">
        سجّل متجرك الجديد واحصل على سنة مجاناً 🎉
      </a>
    </div>
  </div>
</div>
